<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the canvas run under the notch; the UI layer pads itself
         back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a1e12" />
    <meta
      name="description"
      content="Crumb's Bakery — a math game for children where every number fact you master bakes a treat. No ads, no accounts, no data collection."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Crumb's Bakery — every number bakes a treat</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Crumb's Bakery needs JavaScript to run.</noscript>
    <!-- A WebView too old for ES modules ignores the module script entirely and shows a blank
         brown screen, which is indistinguishable from a crash. This runs only on those browsers
         and turns that into something a parent can read and report. -->
    <script nomodule>
      document.getElementById("app").innerHTML =
        '<div style="padding:2rem;font:1rem/1.5 sans-serif;color:#f4e4d4;text-align:center">' +
        "<p><strong>This tablet's browser is too old to run Crumb's Bakery.</strong></p>" +
        "<p>Updating Android System WebView usually fixes it.</p></div>";
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
