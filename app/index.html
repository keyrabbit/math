<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the canvas run under the notch; the UI layer pads itself
         back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0716" />
    <meta
      name="description"
      content="Pipkin — a math game for children where every number fact you master lights a star. No ads, no accounts, no data collection."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pipkin — every number lights a star</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Pipkin needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
